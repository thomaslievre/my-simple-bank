# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: ci-test

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      DB_SOURCE: postgresql://bankroot:secret@localhost:5432/simple_bank?sslmode=disable
    # Service containers to run with `container-job`
    services:
      # Label used to access the service container
      postgres:
        # Docker Hub image
        image: postgres:14-alpine
        # Provide the password for postgres
        env:
          POSTGRES_USER: bankroot
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: simple_bank
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.0 # or "latest", "canary", <sha>

      - name: Install Hardhat dependencies
        run: |
          cd smart-contract
          bun install

      - name: Compile smart contracts
        run: |
          cd smart-contract
          bunx hardhat compile

      - name: Test smart contracts
        run: |
          cd smart-contract
          bunx hardhat test

      - name: Start Hardhat node
        run: |
          cd smart-contract
          nohup bunx hardhat node &
          sleep 5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.19.0/migrate.linux-amd64.tar.gz | tar xvz
          ls
          sudo mv migrate /usr/bin
          which migrate

      - name: Run migrations
        run: |
          cd server
          make migrateup

      - name: Test
        run: |
          cd server
          make test
